<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <style>
    .title { font: 700 24px/1.2 "Segoe UI", Roboto, Arial; fill:#000000; }
    .subtitle { font: 600 16px "Segoe UI", Roboto, Arial; fill:#2C2C2C; }
    .component { fill:#E8F4F8; stroke:#000000; stroke-width:2.5; rx:8; }
    .core-component { fill:#D4E8F0; stroke:#000000; stroke-width:3; rx:8; }
    .data-layer { fill:#F0F0F0; stroke:#000000; stroke-width:2.5; rx:8; }
    .external { fill:#FFE8D4; stroke:#000000; stroke-width:2.5; rx:8; }
    .output { fill:#E8F8E8; stroke:#000000; stroke-width:2.5; rx:8; }
    .cli { fill:#F8F8F8; stroke:#000000; stroke-width:3; rx:10; }
    .connection { stroke:#000000; stroke-width:2; marker-end: url(#arrowhead); }
    .data-flow { stroke:#0066CC; stroke-width:2; stroke-dasharray:5,5; marker-end: url(#arrowhead-blue); }
    .api-call { stroke:#CC6600; stroke-width:2; stroke-dasharray:8,4; marker-end: url(#arrowhead-orange); }
    .text-component { font: 600 14px "Segoe UI", Roboto, Arial; fill:#1A1A1A; }
    .text-desc { font: 400 11px "Segoe UI", Roboto, Arial; fill:#666666; }
    .text-label { font: 500 10px "Segoe UI", Roboto, Arial; fill:#2C2C2C; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CC6600" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="800" y="35" text-anchor="middle" class="title">ClickUp Ticket Intelligence System - Block Diagram</text>
  <text x="800" y="55" text-anchor="middle" class="subtitle">System Architecture &amp; Component Relationships</text>

  <!-- CLI APPLICATION (TOP LEVEL) -->
  <rect x="600" y="100" width="400" height="80" class="cli" />
  <text x="800" y="130" text-anchor="middle" class="text-component">CLI Application</text>
  <text x="800" y="150" text-anchor="middle" class="text-desc">Main Entry Point</text>
  <text x="800" y="165" text-anchor="middle" class="text-desc">Interactive Menu System</text>

  <!-- CONNECTION FROM CLI TO CORE COMPONENTS -->
  <line x1="800" y1="180" x2="800" y2="220" class="connection" />

  <!-- CORE COMPONENTS LAYER -->
  <rect x="50" y="220" width="1500" height="280" style="fill:none; stroke:#666666; stroke-width:1; stroke-dasharray:4,4; rx:10;" />
  <text x="70" y="240" class="text-label">CORE COMPONENTS</text>

  <!-- TICKET FILTER -->
  <rect x="100" y="260" width="280" height="100" class="core-component" />
  <text x="240" y="290" text-anchor="middle" class="text-component">TicketFilter</text>
  <text x="240" y="310" text-anchor="middle" class="text-desc">Filter tickets by criteria</text>
  <text x="240" y="325" text-anchor="middle" class="text-desc">User, Project, Status</text>
  <text x="240" y="340" text-anchor="middle" class="text-desc">Smart &amp; Keyword filtering</text>

  <!-- TICKET STRUCTURER -->
  <rect x="420" y="260" width="280" height="100" class="core-component" />
  <text x="560" y="290" text-anchor="middle" class="text-component">TicketStructurer</text>
  <text x="560" y="310" text-anchor="middle" class="text-desc">Structure data for LLM</text>
  <text x="560" y="325" text-anchor="middle" class="text-desc">Token limit management</text>
  <text x="560" y="340" text-anchor="middle" class="text-desc">JSON/Markdown formatting</text>

  <!-- LLM CLIENT -->
  <rect x="740" y="260" width="280" height="100" class="core-component" />
  <text x="880" y="290" text-anchor="middle" class="text-component">LLMClient</text>
  <text x="880" y="310" text-anchor="middle" class="text-desc">AI API integration</text>
  <text x="880" y="325" text-anchor="middle" class="text-desc">OpenAI &amp; Anthropic</text>
  <text x="880" y="340" text-anchor="middle" class="text-desc">Streaming responses</text>

  <!-- INSIGHTS GENERATOR -->
  <rect x="1060" y="260" width="280" height="100" class="core-component" />
  <text x="1200" y="290" text-anchor="middle" class="text-component">InsightsGenerator</text>
  <text x="1200" y="310" text-anchor="middle" class="text-desc">Orchestrate analysis</text>
  <text x="1200" y="325" text-anchor="middle" class="text-desc">Coordinate components</text>
  <text x="1200" y="340" text-anchor="middle" class="text-desc">Generate insights</text>

  <!-- CONNECTIONS BETWEEN CORE COMPONENTS -->
  <line x1="380" y1="310" x2="420" y2="310" class="connection" />
  <text x="400" y="305" text-anchor="middle" class="text-label">filtered</text>

  <line x1="700" y1="310" x2="740" y2="310" class="connection" />
  <text x="720" y="305" text-anchor="middle" class="text-label">structured</text>

  <line x1="1020" y1="310" x2="1060" y2="310" class="connection" />
  <text x="1040" y="305" text-anchor="middle" class="text-label">insights</text>

  <!-- CONNECTION FROM CLI TO INSIGHTS GENERATOR -->
  <line x1="800" y1="220" x2="1200" y2="260" class="connection" />
  <text x="980" y="235" class="text-label">user request</text>

  <!-- DATA LAYER -->
  <rect x="50" y="540" width="1500" height="180" style="fill:none; stroke:#666666; stroke-width:1; stroke-dasharray:4,4; rx:10;" />
  <text x="70" y="560" class="text-label">DATA LAYER</text>

  <!-- FAKE TICKETS JSON -->
  <rect x="150" y="580" width="200" height="80" class="data-layer" />
  <text x="250" y="610" text-anchor="middle" class="text-component">fake_tickets.json</text>
  <text x="250" y="630" text-anchor="middle" class="text-desc">2000 tickets</text>
  <text x="250" y="645" text-anchor="middle" class="text-desc">Ticket data</text>

  <!-- FAKE USERS JSON -->
  <rect x="400" y="580" width="200" height="80" class="data-layer" />
  <text x="500" y="610" text-anchor="middle" class="text-component">fake_users.json</text>
  <text x="500" y="630" text-anchor="middle" class="text-desc">60 users</text>
  <text x="500" y="645" text-anchor="middle" class="text-desc">User data</text>

  <!-- ANALYSIS RESULTS JSON -->
  <rect x="650" y="580" width="200" height="80" class="data-layer" />
  <text x="750" y="610" text-anchor="middle" class="text-component">analysis_results.json</text>
  <text x="750" y="630" text-anchor="middle" class="text-desc">Preprocessed data</text>
  <text x="750" y="645" text-anchor="middle" class="text-desc">Topics &amp; patterns</text>

  <!-- INSIGHTS MARKDOWN FILES -->
  <rect x="900" y="580" width="200" height="80" class="output" />
  <text x="1000" y="610" text-anchor="middle" class="text-component">insights/*.md</text>
  <text x="1000" y="630" text-anchor="middle" class="text-desc">Generated insights</text>
  <text x="1000" y="645" text-anchor="middle" class="text-desc">Markdown output</text>

  <!-- CONNECTIONS FROM CORE TO DATA LAYER -->
  <line x1="240" y1="360" x2="250" y2="580" class="data-flow" />
  <text x="200" y="470" class="text-label">read</text>

  <line x1="240" y1="360" x2="500" y2="580" class="data-flow" />
  <text x="350" y="470" class="text-label">read</text>

  <line x1="560" y1="360" x2="750" y2="580" class="data-flow" />
  <text x="640" y="470" class="text-label">read</text>

  <line x1="1200" y1="360" x2="1000" y2="580" class="data-flow" />
  <text x="1120" y="470" class="text-label">write</text>

  <!-- EXTERNAL APIS -->
  <rect x="50" y="760" width="1500" height="140" style="fill:none; stroke:#666666; stroke-width:1; stroke-dasharray:4,4; rx:10;" />
  <text x="70" y="780" class="text-label">EXTERNAL APIS</text>

  <!-- OPENAI API -->
  <rect x="400" y="800" width="250" height="70" class="external" />
  <text x="525" y="825" text-anchor="middle" class="text-component">OpenAI API</text>
  <text x="525" y="845" text-anchor="middle" class="text-desc">GPT-4, GPT-3.5</text>
  <text x="525" y="860" text-anchor="middle" class="text-desc">Text generation</text>

  <!-- ANTHROPIC API -->
  <rect x="700" y="800" width="250" height="70" class="external" />
  <text x="825" y="825" text-anchor="middle" class="text-component">Anthropic API</text>
  <text x="825" y="845" text-anchor="middle" class="text-desc">Claude models</text>
  <text x="825" y="860" text-anchor="middle" class="text-desc">Text generation</text>

  <!-- API CONNECTIONS -->
  <line x1="880" y1="360" x2="525" y2="800" class="api-call" />
  <text x="680" y="580" class="text-label">API call</text>

  <line x1="880" y1="360" x2="825" y2="800" class="api-call" />
  <text x="860" y="580" class="text-label">API call</text>

    <!-- LEGEND -->
  <rect x="50" y="940" width="1500" height="120" style="fill:#FAFAFA; stroke:#000000; stroke-width:2; rx:10;" />
  <text x="70" y="965" class="text-component">LEGEND</text>

  <!-- Connection Types -->
  <line x1="100" y1="990" x2="200" y2="990" class="connection" />
  <text x="220" y="995" class="text-desc">Component Connection (direct flow)</text>

  <line x1="100" y1="1015" x2="200" y2="1015" class="data-flow" />
  <text x="220" y="1020" class="text-desc">Data Flow (read/write operations)</text>

  <line x1="100" y1="1040" x2="200" y2="1040" class="api-call" />
  <text x="220" y="1045" class="text-desc">API Call (external service)</text>

  <!-- Component Types -->
  <rect x="550" y="975" width="120" height="35" class="cli" />
  <text x="680" y="997" class="text-desc">CLI Application</text>

  <rect x="550" y="1020" width="120" height="35" class="core-component" />
  <text x="680" y="1042" class="text-desc">Core Component</text>

  <rect x="850" y="975" width="120" height="35" class="data-layer" />
  <text x="980" y="997" class="text-desc">Data Storage</text>

  <rect x="850" y="1020" width="120" height="35" class="external" />
  <text x="980" y="1042" class="text-desc">External API</text>

  <rect x="1150" y="975" width="120" height="35" class="output" />
  <text x="1280" y="997" class="text-desc">Output Files</text>

  <!-- DOCUMENTATION FOOTER -->
  <rect x="100" y="1090" width="1400" height="80" style="fill:#F8F8F8; stroke:#000000; stroke-width:2;" />
  <text x="120" y="1115" class="text-component">ClickUp Ticket Intelligence System - Block Diagram</text>
  <text x="120" y="1135" class="text-desc">Architecture: CLI → Core Components → Data Layer + External APIs → Output</text>
  <text x="120" y="1155" class="text-desc">Data Flow: JSON Input → Filter → Structure → LLM Processing → Markdown Output</text>

  <rect x="100" y="1185" width="1400" height="60" style="fill:#F0F0F0; stroke:#000000; stroke-width:2;" />
  <text x="120" y="1210" class="text-desc">Components: 4 Core | Data: 3 JSON files + Markdown output | APIs: OpenAI &amp; Anthropic</text>
  <text x="120" y="1230" class="text-desc">Processing: Filter tickets → Structure for LLM → Generate insights → Save results</text>

  <rect x="300" y="1270" width="1000" height="60" style="fill:#FFFFFF; stroke:#000000; stroke-width:3;" />
  <text x="800" y="1295" text-anchor="middle" class="title">CLICKUP TICKET INTELLIGENCE ARCHITECTURE</text>
  <text x="800" y="1315" text-anchor="middle" class="text-desc">AI-Powered System</text>

  <ellipse cx="800" cy="1370" rx="120" ry="25" style="fill:#000000; stroke:#000000; stroke-width:3;" />
  <text x="800" y="1378" text-anchor="middle" style="font: 700 14px 'Segoe UI', Roboto, Arial; fill:#FFFFFF;">ARCHITECTURE COMPLETE</text>

</svg>

